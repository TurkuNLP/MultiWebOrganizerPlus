# Configuration for the split-maintenance label pipeline.

mode: "discover"  # choice: discover, classify
aspect: "topics"
run_name: "roihu1"  # name of the run, used to create output directories and files

model:
  name: "Qwen/Qwen3.8-27B"
  batch_size: 512
  max_model_len: 32768
  max_document_tokens: 8192
  classification_max_tokens: 4096
  maintenance_max_tokens: 8192
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.90
  dtype: "auto"
  seed: 0
  thinking_mode: "disabled"  # disabled, enabled, template-default

paths:
  jsonl_input: "/scratch/project_2020507/users/tarkkaot/MultiWebOrganizerPlus/data/FineWebSmallSample.jsonl"
  seed_labels: "/scratch/project_2020507/users/tarkkaot/MultiWebOrganizerPlus/configs/seed_labels/topics.yaml"
  taxonomy: "/scratch/project_2020507/users/tarkkaot/MultiWebOrganizerPlus/results/${run_name}/taxonomy_state.json"
  discovery_output: "/scratch/project_2020507/users/tarkkaot/MultiWebOrganizerPlus/results/${run_name}/discovery.jsonl"
  output: "/scratch/project_2020507/users/tarkkaot/MultiWebOrganizerPlus/results/${run_name}/final_labels.jsonl"

discovery:
  max_proposals_per_doc: 3
  max_assigned_labels_per_doc: 5
  creativity: "high"  # controls how eager the model is to propose new labels
# choice: low, high

maintenance:
  # Screen new proposal groups after this many newly persisted documents.
  screen_every: 2048

  # Bound each model-facing maintenance call.
  max_screening_groups: 16
  max_promotion_groups: 16
  max_revision_labels: 16

  # Support threshold before promotion.
  min_promotion_support: 2

  max_total_labels: 100
  expected_seed_label_count: 24

runtime:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  compute_logging: true
  compute_logging_interval: 300
  reset_discovery: false
  overwrite_output: false